name: Release

# 出包流程：打 tag（v*）或手动触发 → 构建签名 release APK 与 16 个插件 jar → 创建 GitHub Release。
#
# 模块路径跟着插件归位走：插件住在 plugins/<类>/<名>，Gradle 路径就是 :plugins:<类>:<名>
# （见 settings.gradle.kts）。宿主是 :host-app，不是早期的 :host。
#
# **forge-compiler 不在这个清单里**：它的载荷（26 MB 编译器 dex + jar）由
# scripts/forge-payload.sh 从一次已验证的探针产物生成，CI 里既没有探针、也没有
# /sdcard/EV/mods/compileprobe.jar；而它默认关闭、按需安装。要发它就单独跑：
#   scripts/forge-payload.sh --from-probe <probe.jar> --out plugins/integration/forge-compiler/payload
#   ./gradlew :plugins:integration:forge-compiler:bundlePlugin --no-configuration-cache
#
# 签名材料不在仓库里（keystore.properties 与 *.jks 都被 gitignore），CI 从 Secrets 还原：
#   KEYSTORE_BASE64      release-keystore.jks 的 base64（`base64 -w0 release-keystore.jks`）
#   KEYSTORE_PROPERTIES  完整的 keystore.properties 文本
# 两个都缺失时 workflow 会带着可读的错误失败，而不是打出一个 debug 签名的包混进 Release。
#
# 已装旧版（debug 签名或不同密钥）的用户无法覆盖安装，这是签名机制决定的，不是 bug。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # fetch-depth: 0 是硬要求：内核冻结门禁要把「内核落库的那次提交」解析成真实提交，
      # 浅克隆会让它无法工作。
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Kernel freeze gate
        run: bash scripts/kernel-freeze.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 签名材料还原失败必须当场失败。悄悄跳过会让 Release 里出现一个 debug 签名的包，
      # 那种包用户装上之后再也无法被后续正式版本覆盖。
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 或 KEYSTORE_PROPERTIES secret，拒绝打出未签名的 release 包" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
          # 只打印别名与文件是否存在，不打印任何密码。
          grep -E '^(storeFile|keyAlias)=' keystore.properties
          test -s release-keystore.jks

      # 出包前先过 CI 门禁，避免把一个本来就红的提交发出去。
      - name: Run JVM and unit tests
        run: ./gradlew test --console=plain

      - name: Check SDK API snapshots
        run: ./gradlew :host-api:apiSnapshotCheck :ui-kit:apiSnapshotCheck --console=plain

      # 发布必须走 :host-app:releaseGate（签名 + 共享包 + 禁忌包三重校验）。
      # assembleRelease 本身 deliberately 不跑 verifyReleaseSigning，直接拿它的产物发版
      # 等于跳过门禁——这一行就是那道门。
      - name: Release gate
        run: ./gradlew :host-app:releaseGate --console=plain

      - name: Assemble signed release APK
        run: ./gradlew :host-app:assembleRelease --console=plain

      - name: Verify the APK is signed with the release key
        run: |
          apk=host-app/build/outputs/apk/release/host-app-release.apk
          test -f "$apk"
          # apksigner 不在 hosted runner 的 PATH 上，要从 SDK 的 build-tools 里取最新一份。
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner="$(ls -d "$sdk_root"/build-tools/*/ | sort -V | tail -1)apksigner"
          test -x "$apksigner" || { echo "::error::找不到 apksigner（$apksigner）" >&2; exit 1; }
          # `verify --print-certs` 会打印证书；debug 证书的主题固定是 CN=Android Debug。
          "$apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK 仍是 debug 签名，不可发布" >&2
            exit 1
          fi

      # 16 个插件：4 类（base / feature / integration / resource）。
      # forge-compiler 见文件头：要载荷，单独发。
      # bundlePlugin 不兼容配置缓存（gradle/plugin-verify.gradle.kts 已声明），显式关掉。
      - name: Bundle plugin jars
        run: |
          set -euo pipefail
          ./gradlew --no-configuration-cache \
            :plugins:base:agent-tools:bundlePlugin \
            :plugins:base:agent-memory:bundlePlugin \
            :plugins:base:agent-log:bundlePlugin \
            :plugins:base:agent-device:bundlePlugin \
            :plugins:base:agent-gui:bundlePlugin \
            :plugins:base:agent-phone:bundlePlugin \
            :plugins:base:agent-shell:bundlePlugin \
            :plugins:base:linux:bundlePlugin \
            :plugins:feature:ev-ui:bundlePlugin \
            :plugins:feature:agent-brain:bundlePlugin \
            :plugins:feature:agent-prompt:bundlePlugin \
            :plugins:feature:agent-browse:bundlePlugin \
            :plugins:integration:agent-model:bundlePlugin \
            :plugins:integration:agent-web:bundlePlugin \
            :plugins:integration:forge:bundlePlugin \
            :plugins:resource:theme-default:bundlePlugin \
            --console=plain
          mkdir -p dist/plugins
          # 每个插件目录里除了 jar 还有一份同名 .json sidecar，必须一起发，否则加载期缺元数据。
          # forge-compiler 跳过：它的 dist 只有在本地跑过载荷之后才会存在，不属于这个包。
          for dir in plugins/*/*/build/dist; do
            case "$dir" in *forge-compiler*) continue;; esac
            cp -v "$dir"/*.jar "$dir"/*.json dist/plugins/ 2>/dev/null || true
          done
          # 逐个点名校验，而不是数个数：缺了哪一个要能一眼看出来。
          missing=0
          for id in agent-tools agent-memory agent-log agent-device agent-gui agent-phone \
                    agent-shell linux ev-ui agent-brain agent-prompt agent-browse \
                    agent-model agent-web forge theme-default; do
            [ -f "dist/plugins/$id.jar" ]  || { echo "::error::缺少 $id.jar"  >&2; missing=1; }
            [ -f "dist/plugins/$id.json" ] || { echo "::error::缺少 $id.json" >&2; missing=1; }
          done
          test "$missing" -eq 0
          ls -l dist/plugins
          ( cd dist/plugins && zip -q -9 ../plugins.zip ./* )

      - name: Name the artifacts after the version
        id: version
        run: |
          version="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp host-app/build/outputs/apk/release/host-app-release.apk "dist/EV-${version}.apk"
          mv dist/plugins.zip "dist/EV-${version}-plugins.zip" 2>/dev/null || true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: EV ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            dist/EV-${{ steps.version.outputs.version }}.apk
            dist/EV-${{ steps.version.outputs.version }}-plugins.zip
          body: |
            EV ${{ steps.version.outputs.version }}

            **安装说明**
            - `EV-<version>.apk`：宿主应用，release 签名
            - `EV-<version>-plugins.zip`：16 个插件（jar + json sidecar）
            - `forge-compiler`（设备端编译器，26 MB）**不在这包里**：它需要 `scripts/forge-payload.sh`
              生成的载荷，默认关闭、按需安装。

            插件是独立分发的：解压后把 jar 和 json 一起放进 `/sdcard/EV/mods/`，
            启动应用后在「插件管理」里逐个确认（未签名插件需要人工批准，这是刻意的设计）。

            如果设备上装过 debug 签名或不同密钥的版本，**必须先卸载**再安装本版本，
            否则会因签名不一致安装失败（数据会丢，插件文件在 /sdcard 不受影响）。
