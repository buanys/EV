# 版本目录：共享依赖与插件版本的**唯一来源**。
#
# 为什么要有它：同一个坐标曾经在 27 个模块里各写一遍（junit 20 次、kotlin-stdlib 16 次、
# org.json 13 次），改一次版本要 grep 全仓；更糟的是**同一族依赖被写成了不同版本**
# （coroutines-core 1.10.2 vs coroutines-android 1.11.0、serialization 1.8.1 vs 1.11.0），
# 靠人眼发现不了。这里定死一版，模块只能用别名。
#
# 只收「多个模块共用」或「版本必须对齐」的坐标。一次性依赖（dexkit、libxposed、markdown、
# R8、commons-compress …）留在各自的 build.gradle.kts 里——搬进来只会多一层间接。
#
# 例外：`:packages` 是**对外发布的库**，它把 serialization 钉在 1.8.1 是有意的（POM 里
# 不替使用者抬版本）。那个字面量不要换成本目录里的别名。

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
compose = "1.12.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationEvent = "1.1.2"
iconsCore = "1.7.8"
miuix = "0.9.4"
# COUI：ColorOS 17「凝光视效」风格的 Compose 组件库。与 EV 的工具链版本对齐
# （AGP 9.4.1 / Kotlin 2.4.20 / Compose 1.12.0 / compileSdk 37），mpL-2.0。
# 注意它是 alpha：API 会变，所以只在 ui-kit 内部使用，插件看到的是 ev.buan.ui。
coui = "0.0.1-alpha9"
okhttp = "5.5.0"
jsoup = "1.23.2"
junit4 = "4.13.2"
junit5 = "5.12.2"
json = "20260814"
atomicfu = "0.26.1"
mavenPublish = "0.34.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }

compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "iconsCore" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "navigationEvent" }

coui = { module = "io.github.itoseo:coui", version.ref = "coui" }
coui-icons = { module = "io.github.itoseo:coui-icons", version.ref = "coui" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav-android", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-sam-with-receiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
